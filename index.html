
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali 🪔</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #19002e, #650047, #ff6a00);
    color: white;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    padding: 60px 20px;
}

h1 {
    font-size: clamp(40px, 8vw, 65px);
    color: #ffdf70;
    text-shadow: 0 0 20px orange;
    margin: 30px 0;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px orange; }
    to { text-shadow: 0 0 35px yellow; }
}

p {
    font-size: 20px;
    line-height: 1.6;
    margin: 20px auto;
}

.diyas {
    font-size: 65px;
    margin: 35px;
    animation: bounce 1.5s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-15px); }
}

button {
    background: #ffcc00;
    color: #5b0033;
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
    transition: 0.3s;
}

button:hover {
    background: white;
    transform: scale(1.1);
}

#message {
    margin-top: 25px;
    font-size: 24px;
    color: #ffe88a;
}

footer {
    margin-top: 70px;
    padding: 20px;
    color: #ffdf70;
}

.sparkle {
    position: fixed;
    pointer-events: none;
    animation: fly 2s ease-out forwards;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-150px) scale(0);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="diyas">🪔 🪔 🪔</div>

    <h1>Happy Diwali!</h1>

    <p>
        May your life shine like a diya,<br>
        May your happiness sparkle like fireworks,<br>
        And may your home be filled with love and prosperity.
    </p>

    <div class="diyas">✨ 🎆 🪔 🎆 ✨</div>

    <h2>Festival of Lights</h2>

    <p>Celebrate the joy, love and happiness of Diwali!</p>

    <button onclick="celebrate()">
        Click for Surprise 🎁
    </button>

    <div id="message"></div>

</div>

<footer>
    Made with ❤️ for Diwali Celebration
</footer>

<script>
function celebrate() {
    document.getElementById("message").innerHTML =
        "🎉 Wishing You and Your Family a Very Happy Diwali! 🪔";

    for (let i = 0; i < 30; i++) {
        let sparkle = document.createElement("div");

        sparkle.className = "sparkle";
        sparkle.innerHTML = "✨";
        sparkle.style.left = Math.random() * 100 + "vw";
        sparkle.style.top = Math.random() * 100 + "vh";
        sparkle.style.fontSize = "25px";

        document.body.appendChild(sparkle);

        setTimeout(() => sparkle.remove(), 2000);
    }
}
</script>

</body>
</html>
